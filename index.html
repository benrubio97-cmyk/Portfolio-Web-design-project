<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi HTML Wireframe</title>
    <style>
        /* Base Wireframe Resets & Variables */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: monospace; background: #ffffff; color: #333333; padding: 20px; line-height: 1.5; }
        
        /* Layout Grid Helpers */
        .wf-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .wf-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col-4 { flex: 1; min-width: 250px; }
        .col-8 { flex: 2; min-width: 300px; }

        /* Generic Wireframe Components (Grayscale Style) */
        .wf-box { border: 2px dashed #999999; background: #f0f0f0; padding: 20px; display: flex; align-items: center; justify-content: center; text-align: center; }
        .wf-header { height: 60px; justify-content: space-between; border-style: solid; }
        .wf-footer { height: 60px; border-style: solid; margin-top: 40px; }
        
        /* Crossed Box for Image Placeholders */
        .wf-image-placeholder { 
            height: 200px; 
            border: 2px solid #999999; 
            background: repeating-linear-gradient(45deg, #f0f0f0, #f0f0f0 10px, #e0 e0 e0 10px, #e0 e0 e0 20px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* UI Element Placeholders */
        .wf-text-line { height: 12px; background: #e0e0e0; margin-bottom: 8px; border-radius: 2px; }
        .wf-text-line.short { width: 60px; }
        .wf-text-line.medium { width: 140px; }
        .wf-text-line.long { width: 100%; }
        
        .wf-button { display: inline-block; padding: 8px 16px; border: 2px solid #333333; background: #e0e0e0; font-weight: bold; cursor: pointer; text-align: center; }
        .wf-nav-links { display: flex; gap: 15px; }
        .wf-nav-link { text-decoration: underline; color: #333333; }
    </style>
</head>
<body>

    <div class="wf-container">
        
        <!-- HEADER / NAVIGATION -->
        <header class="wf-box wf-header">
            <div class="wf-button">LOGO</div>
            <nav class="wf-nav-links">
                <span class="wf-nav-link">[Link 1]</span>
                <span class="wf-nav-link">[Link 2]</span>
                <span class="wf-nav-link">[Link 3]</span>
            </nav>
        </header>

        <!-- MAIN CONTENT LAYER -->
        <main class="wf-row">
            
            <!-- LEFT COLUMN: CONTENT -->
            <section class="col-8 wf-box" style="flex-direction: column; align-items: stretch; text-align: left; gap: 15px;">
                <h2>[Main Heading Placeholder]</h2>
                
                <!-- Simulated Text Paragraph -->
                <div>
                    <div class="wf-text-line long"></div>
                    <div class="wf-text-line long"></div>
                    <div class="wf-text-line medium"></div>
                </div>

                <!-- Image Placeholder -->
                <div class="wf-image-placeholder">IMAGE PLACEHOLDER (X)</div>

                <div>
                    <div class="wf-text-line long"></div>
                    <div class="wf-text-line short"></div>
                </div>

                <button class="wf-button">CALL TO ACTION</button>
            </section>

            <!-- RIGHT COLUMN: SIDEBAR -->
            <aside class="col-4 wf-box" style="flex-direction: column; align-items: stretch; text-align: left; gap: 15px;">
                <h3>[Sidebar Title]</h3>
                <div class="wf-box" style="height: 100px;">[Widget 1]</div>
                <div class="wf-box" style="height: 100px;">[Widget 2]</div>
            </aside>

        </main>

        <!-- FOOTER -->
        <footer class="wf-box wf-footer">
            <span>[Footer Text & Copyright info]</span>
        </footer>

    </div>

</body>
</html>
